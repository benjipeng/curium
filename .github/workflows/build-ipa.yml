name: Build Chromium Blink iOS IPA
run-name: ${{ inputs.backfill_index_only && 'Backfill graph index' || inputs.verify_only && 'Verify Swift objects' || 'IPA' }} · ${{ github.ref_name }} · run #${{ github.run_number }}

# Orchestration only: every stage runs scripts/stage.sh, and its checkpoint key
# comes from scripts/plan_pipeline.py (inputs by content, never this YAML).
#
#   0 SDK stub (Mac) -> 1 Codegen (Linux) -> 2 Apple tools (Mac)
#     -> 3 Compile x 18 (Linux, parallel) -> 4 Link (Linux) -> 5 Package (Mac)
#
# Finished stages and shards are reused across runs; a new run only does the
# work whose checkpoint is missing. Pure implementation-only patch edits can
# also reuse an anchor commit's codegen, apple, and untouched compile shards
# via its published graph index. To rebuild a stage on purpose, bump its epoch
# in ci/epochs.json.
#
# Only a stage's build and checkpoint steps decide its outcome; ccache uploads,
# graph-index publication, and summaries are best-effort and never block the
# stages after it.

on:
  workflow_dispatch:
    inputs:
      with_app_groups:
        description: "Ad-hoc sign IPA with App Group entitlements"
        type: boolean
        default: false
      publish_release:
        description: "Publish built IPA to GitHub Releases"
        type: boolean
        default: false
      inject_failure:
        description: "Recovery test: fail on purpose (shard 0 before/after its checkpoint, or link before linking)"
        type: choice
        options: [none, shard-before-commit, shard-after-commit, link]
        default: none
      shards:
        description: "Rescue: build only these compile shards (e.g. 15 or 3,15), beside a running build; stops before link"
        type: string
        default: ""
      verify_only:
        description: "Stop after Stage 2 + Swift-dependent object gate (skip compile shards, link, and package)"
        type: boolean
        default: false
      incremental:
        description: "Reuse anchor codegen, apple, and untouched compile shards for pure implementation patch edits"
        type: boolean
        default: true
      baseline_commit:
        description: "Optional anchor commit SHA/ref for incremental planning (empty = auto-discover in git history)"
        type: string
        default: ""
      backfill_index_only:
        description: "Publish missing graph index for HEAD's existing codegen/apple checkpoints without compiling or linking"
        type: boolean
        default: false

# Every workflow that writes GHCR checkpoints shares this group. A shard rescue
# writes only its own shards' tags, so it runs in a group of its own.
concurrency:
  group: ${{ inputs.shards == '' && 'ghcr-writes' || format('ghcr-shards-{0}', inputs.shards) }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ORAS_USER: ${{ github.actor }}

jobs:
  preflight:
    name: Preflight - source & SDK
    runs-on: ubuntu-24.04
    outputs:
      stub_tag: ${{ steps.preflight.outputs.stub_tag }}
      need_sdk: ${{ steps.preflight.outputs.need_sdk }}
    steps:
      - uses: actions/checkout@v5
      - id: preflight
        run: ./scripts/stage.sh plan preflight

  sdk:
    name: 0 SDK stub (Mac)
    needs: preflight
    if: needs.preflight.outputs.need_sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      STUB_TAG: ${{ needs.preflight.outputs.stub_tag }}
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/stage.sh sdk run

  plan:
    name: Plan
    needs: [preflight, sdk]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      chromium_rev: ${{ steps.plan.outputs.chromium_rev }}
      chromium_version: ${{ steps.plan.outputs.chromium_version }}
      src_ref: ${{ steps.plan.outputs.src_ref }}
      stub_ref: ${{ steps.plan.outputs.stub_ref }}
      stage_cache: ${{ steps.plan.outputs.stage_cache }}
      k_codegen: ${{ steps.plan.outputs.k_codegen }}
      index_ref: ${{ steps.plan.outputs.index_ref }}
      codegen_ref: ${{ steps.plan.outputs.codegen_ref }}
      apple_ref: ${{ steps.plan.outputs.apple_ref }}
      compile_prefix: ${{ steps.plan.outputs.compile_prefix }}
      link_ref: ${{ steps.plan.outputs.link_ref }}
      ccache_repo: ${{ steps.plan.outputs.ccache_repo }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards_json: ${{ steps.plan.outputs.shards_json }}
      shard_keys_json: ${{ steps.plan.outputs.shard_keys_json }}
      compile_matrix_json: ${{ steps.plan.outputs.compile_matrix_json }}
      incremental_mode: ${{ steps.plan.outputs.incremental_mode }}
      anchor_commit: ${{ steps.plan.outputs.anchor_commit }}
      expected_graph_sha: ${{ steps.plan.outputs.expected_graph_sha }}
      expected_codegen_sha: ${{ steps.plan.outputs.expected_codegen_sha }}
      expected_objects_sha: ${{ steps.plan.outputs.expected_objects_sha }}
      run_codegen: ${{ steps.plan.outputs.run_codegen }}
      run_index_backfill: ${{ steps.plan.outputs.run_index_backfill }}
      run_apple: ${{ steps.plan.outputs.run_apple }}
      run_verify_apple_objects: ${{ steps.plan.outputs.run_verify_apple_objects }}
      run_compile: ${{ steps.plan.outputs.run_compile }}
      run_link: ${{ steps.plan.outputs.run_link }}
      run_package: ${{ steps.plan.outputs.run_package }}
      k_package: ${{ steps.plan.outputs.k_package }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          WITH_APP_GROUPS: ${{ inputs.with_app_groups }}
          ONLY_SHARDS: ${{ inputs.shards }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          INCREMENTAL: ${{ inputs.incremental }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          BACKFILL_INDEX_ONLY: ${{ inputs.backfill_index_only }}
        run: ./scripts/stage.sh plan run

  codegen:
    name: 1 Codegen (Linux)
    needs: plan
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_codegen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      JOB_TIMEOUT_MIN: 165
      PERSIST_RESERVE_MIN: 15
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      K_CODEGEN: ${{ needs.plan.outputs.k_codegen }}
      INDEX_REF: ${{ needs.plan.outputs.index_ref }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      CCACHE_REPO: ${{ needs.plan.outputs.ccache_repo }}
      CHROMIUM_REV: ${{ needs.plan.outputs.chromium_rev }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh codegen check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen init
      - name: Prepare tree, plan & audit
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen prepare
      - name: Check bundled probe in the patched source snapshot
        if: steps.check.outputs.done != 'true'
        run: python3 scripts/check_remote_patches.py --patched-source /tmp/cb_work/src
      - id: build
        name: Build host tools, Rust & generated files
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen build
      - id: build_index
        name: Build graph index
        if: steps.build.outcome == 'success'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          mkdir -p "$RUNNER_TEMP/stage/index_out"
          ./scripts/graph_index.py build \
            --out-dir /tmp/cb_work/src/out/Release \
            --ninja /tmp/cb_work/src/third_party/ninja/ninja \
            --src-dir /tmp/cb_work/src \
            --k-codegen "$K_CODEGEN" \
            --src-ref "$SRC_REF" \
            --stub-ref "$STUB_REF" \
            --shard-count "$SHARD_COUNT" \
            --require-rg \
            --output "$RUNNER_TEMP/stage/index_out/graph_index.json"
      - id: persist
        name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh codegen persist
      - name: Publish graph index
        if: steps.persist.outcome == 'success' && steps.build_index.outcome == 'success'
        continue-on-error: true
        run: ./scripts/oci_artifacts.sh push "$INDEX_REF" "$RUNNER_TEMP/stage/index_out" graph_index.json --repo "$GITHUB_REPOSITORY" --once
      - name: Persist ccache bucket
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: ./scripts/stage.sh codegen persist-cache
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "1 Codegen (Linux)"
          --checkpoint "$CODEGEN_REF" --key "${CODEGEN_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ccache-dir "$RUNNER_TEMP/ccache" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  index_backfill:
    name: 1.5 Backfill graph index (Linux)
    needs: plan
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_index_backfill == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOB_TIMEOUT_MIN: 45
      PERSIST_RESERVE_MIN: 5
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      K_CODEGEN: ${{ needs.plan.outputs.k_codegen }}
      INDEX_REF: ${{ needs.plan.outputs.index_ref }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh probe index-check
      - name: Build and publish graph index from existing checkpoints
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh probe index-backfill

  apple:
    name: 2 Apple tools (Mac)
    needs: [plan, codegen]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_apple == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      JOB_TIMEOUT_MIN: 120
      PERSIST_RESERVE_MIN: 10
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh apple check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple init
      - name: Prepare tree & reduce graph to Apple edges
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple prepare
      - id: build
        name: Run & record Apple tools
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh apple persist
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "2 Apple tools (Mac)"
          --checkpoint "$APPLE_REF" --key "${APPLE_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  verify_apple_objects:
    name: 2.5 Verify Swift-dependent objects (Linux)
    needs: [plan, codegen, apple]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_verify_apple_objects == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOB_TIMEOUT_MIN: 45
      PERSIST_RESERVE_MIN: 5
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      INCREMENTAL_MODE: ${{ needs.plan.outputs.incremental_mode }}
      EXPECTED_GRAPH_SHA: ${{ needs.plan.outputs.expected_graph_sha }}
      EXPECTED_CODEGEN_SHA: ${{ needs.plan.outputs.expected_codegen_sha }}
      EXPECTED_OBJECTS_SHA: ${{ needs.plan.outputs.expected_objects_sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Compile Swift-dependent ObjC++ gate objects
        run: ./scripts/stage.sh probe apple-objects

  compile:
    name: 3 Compile shard ${{ matrix.target.shard }} (Linux)
    needs: [plan, codegen, apple, verify_apple_objects]
    if: ${{ !failure() && !cancelled() && !inputs.verify_only && needs.plan.outputs.run_compile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.compile_matrix_json) }}
    env:
      JOB_TIMEOUT_MIN: 185
      PERSIST_RESERVE_MIN: 20
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      COMPILE_PREFIX: ${{ needs.plan.outputs.stage_cache }}:compile-${{ matrix.target.key }}
      CCACHE_REPO: ${{ needs.plan.outputs.ccache_repo }}
      CHROMIUM_REV: ${{ needs.plan.outputs.chromium_rev }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      SHARD_INDEX: ${{ matrix.target.shard }}
      INCREMENTAL_MODE: ${{ needs.plan.outputs.incremental_mode }}
      EXPECTED_GRAPH_SHA: ${{ needs.plan.outputs.expected_graph_sha }}
      EXPECTED_CODEGEN_SHA: ${{ needs.plan.outputs.expected_codegen_sha }}
      EXPECTED_OBJECTS_SHA: ${{ needs.plan.outputs.expected_objects_sha }}
      INJECT_FAILURE: ${{ inputs.inject_failure }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh compile check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile init
      - name: Prepare tree & plan shard
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile prepare
      - name: Verify incremental graph invariance & shard cleanliness
        if: steps.check.outputs.done != 'true' && needs.plan.outputs.incremental_mode == 'true'
        run: |
          set -euo pipefail
          [ -n "${EXPECTED_GRAPH_SHA:-}" ] || { echo "::error::Missing EXPECTED_GRAPH_SHA in incremental mode"; exit 1; }
          [ -n "${EXPECTED_CODEGEN_SHA:-}" ] || { echo "::error::Missing EXPECTED_CODEGEN_SHA in incremental mode"; exit 1; }
          [ -n "${EXPECTED_OBJECTS_SHA:-}" ] || { echo "::error::Missing EXPECTED_OBJECTS_SHA in incremental mode"; exit 1; }
          ./scripts/graph_index.py verify \
            --out-dir /tmp/cb_work/src/out/Release \
            --ninja /tmp/cb_work/src/third_party/ninja/ninja \
            --expected-graph-sha "$EXPECTED_GRAPH_SHA" \
            --expected-codegen-sha "$EXPECTED_CODEGEN_SHA" \
            --expected-objects-sha "$EXPECTED_OBJECTS_SHA"
          python3 scripts/check_remote_patches.py --patched-source /tmp/cb_work/src
          dirty="$(awk '$2 ~ /^(CC|CXX|OBJC|OBJCXX|ASM|CXX_MODULE|RUST)/ || ($3 ~ /^clang_/ && $2 != "STAMP")' "$RUNNER_TEMP/stage/shard_plan.txt" \
            | grep -vE ' (CC|CXX|OBJC|OBJCXX|ASM) target$' || true)"
          if [ -n "$dirty" ]; then
            echo "::error::Incremental shard $SHARD_INDEX would redo host, Rust, or codegen work"
            printf '%s\n' "$dirty"
            cat "$RUNNER_TEMP/stage/shard_plan.txt"
            exit 1
          fi
      - id: build
        name: Compile shard objects
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh compile persist
      - name: Persist ccache bucket
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: ./scripts/stage.sh compile persist-cache
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "3 Compile shard ${{ matrix.target.shard }}"
          --checkpoint "$COMPILE_PREFIX-${{ matrix.target.shard }}" --key "${COMPILE_PREFIX##*:}-${{ matrix.target.shard }}"
          --outcome "${{ steps.build.outcome }}" --start-epoch "${JOB_START:-0}"
          --ccache-dir "$RUNNER_TEMP/ccache" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  link:
    name: 4 Link (Linux)
    needs: [plan, codegen, apple, verify_apple_objects, compile]
    if: ${{ !failure() && !cancelled() && !inputs.verify_only && needs.plan.outputs.run_link == 'true' && (needs.plan.outputs.run_compile != 'true' || needs.compile.result == 'success') && (needs.plan.outputs.run_verify_apple_objects != 'true' || needs.verify_apple_objects.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOB_TIMEOUT_MIN: 180
      PERSIST_RESERVE_MIN: 15
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      STAGE_CACHE: ${{ needs.plan.outputs.stage_cache }}
      COMPILE_PREFIX: ${{ needs.plan.outputs.compile_prefix }}
      SHARD_KEYS_JSON: ${{ needs.plan.outputs.shard_keys_json }}
      LINK_REF: ${{ needs.plan.outputs.link_ref }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      INCREMENTAL_MODE: ${{ needs.plan.outputs.incremental_mode }}
      EXPECTED_GRAPH_SHA: ${{ needs.plan.outputs.expected_graph_sha }}
      EXPECTED_CODEGEN_SHA: ${{ needs.plan.outputs.expected_codegen_sha }}
      EXPECTED_OBJECTS_SHA: ${{ needs.plan.outputs.expected_objects_sha }}
      INJECT_FAILURE: ${{ inputs.inject_failure }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh link check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link init
      - name: Prepare tree & import verified shard objects
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link prepare
      - id: build
        name: Link Chromium.app
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh link persist
      - name: Upload engine symbols
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Chromium-Blink-${{ needs.plan.outputs.chromium_version }}-arm64-symbols
          path: ${{ runner.temp }}/stage/symbols/
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "4 Link (Linux)"
          --checkpoint "$LINK_REF" --key "${LINK_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  package:
    name: 5 Package IPA (Mac)
    needs: [plan, link]
    if: ${{ !failure() && !cancelled() && !inputs.verify_only && needs.plan.outputs.run_package == 'true' && (needs.plan.outputs.run_link != 'true' || needs.link.result == 'success') }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      LINK_REF: ${{ needs.plan.outputs.link_ref }}
      CHROMIUM_VERSION: ${{ needs.plan.outputs.chromium_version }}
      WITH_APP_GROUPS: ${{ inputs.with_app_groups }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/stage.sh package run
      - uses: actions/upload-artifact@v6
        with:
          name: Chromium-Blink-${{ needs.plan.outputs.chromium_version }}-arm64
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
          retention-days: 30
      - name: Publish GitHub Release
        if: inputs.publish_release == true
        run: |
          tag="v${CHROMIUM_VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Chromium Blink iOS ${CHROMIUM_VERSION} (CI Run #${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned arm64 iOS build with Blink engine, Chromium ${{ needs.plan.outputs.chromium_rev }}."
          gh release upload "$tag" dist/*.ipa dist/*.ipa.sha256 --clobber
