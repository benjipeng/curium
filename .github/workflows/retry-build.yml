name: Retry failed build once

# A failed build run is re-run once, failed jobs only. Finished checkpoints are
# reused, so the retry redoes only what failed; transient runner or registry
# faults heal without a manual dispatch. A second failure is left for a human.

on:
  workflow_run:
    workflows: ["Build Curium Kernel"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run failed jobs of run ${{ github.event.workflow_run.id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run rerun "${{ github.event.workflow_run.id }}" --failed -R "$GITHUB_REPOSITORY"
